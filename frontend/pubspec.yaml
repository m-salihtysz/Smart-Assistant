name: smart_assistant
description: "Smart Assistant: kişisel planlama ve yapay zeka asistanı (iOS)."
publish_to: 'none'

# Sürüm: <ad>+<derleme numarası>. App Store'a her yüklemede derleme numarasını artır.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Durum yönetimi (oturum/dil/tema)
  provider: ^6.1.2

  # Sunucu iletişimi
  http: ^1.2.2

  # Yerel veri (aktiviteler, notlar vb.) ve ayarlar
  shared_preferences: ^2.3.3

  # Oturum token'larını Keychain/Keystore'da saklamak için
  flutter_secure_storage: ^9.2.4

  # Yerel bildirimler (hatırlatıcılar)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# `dart run flutter_launcher_icons` ile iOS ikonlarını üretir (icon.png pakete girmez).
flutter_launcher_icons:
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/home/
