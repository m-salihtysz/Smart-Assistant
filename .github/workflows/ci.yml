name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: sa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
      - run: pip install -r requirements-dev.txt "psycopg[binary]>=3.1"
      - name: Statik analiz
        run: ruff check app tests alembic
      - name: Testler (SQLite)
        run: pytest -q
      - name: Testler (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:pw@localhost:5432/sa
      - name: Migration'lar PostgreSQL'de uygulanır
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:pw@localhost:5432/sa
          SECRET_KEY: ci-secret-key-ci-secret-key-0123456789

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
